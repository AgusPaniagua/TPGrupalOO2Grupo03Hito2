spring.application.name=tp-hito-2

# Conexión a MySQL (con variables de entorno y valores por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tp_hito_2_grupo_3?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# Thymeleaf
spring.thymeleaf.cache=false
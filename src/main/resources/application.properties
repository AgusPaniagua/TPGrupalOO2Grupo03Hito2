spring.application.name=tp-hito-2

# Conexión a MySQL (con variables de entorno y valores por defecto)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tp_hito_2_grupo_3?allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useSSL=false&serverTimezone=America/Argentina/Buenos_Aires}
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=America/Argentina/Buenos_Aires

# Thymeleaf
spring.thymeleaf.cache=false

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# Liquidación de haberes (valores del enunciado, configurables)
liquidacion.sueldo-base=100000
liquidacion.plus-por-anio-antiguedad=5000
liquidacion.dias-por-intervalo=15
liquidacion.porcentaje-por-intervalo=0.5

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body class="admin-body">

    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="admin-main">
        <div class="admin-container">
            <div class="table-responsive mt-4">
    <table class="table table-hover text-white">
        <thead>
            <tr>
                <th>Nombre y apellido</th>
                <th>DNI</th>
                <th>Email</th>
                <th>Tipo</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>

        <tbody>
            <tr th:each="empleado : ${empleados}">
                <td th:text="${empleado.nombre + ' ' + empleado.apellido}"></td>
                <td th:text="${empleado.dni}"></td>
                <td th:text="${empleado.email}"></td>
                <td th:text="${empleado.tipo}"></td>

                <td>
                    <span th:if="${empleado.activo}" class="badge badge-success">
                        Activo
                    </span>
                    <span th:unless="${empleado.activo}" class="badge badge-secondary">
                        Inactivo
                    </span>
                </td>

                <td>
                    <!-- Acciones para empleados activos -->
                    <div th:if="${empleado.activo}">
                        <a th:href="@{/responsable/empleados/{id}/editar(id=${empleado.idStaff})}"
                           class="btn btn-sm btn-primary">
                            Modificar
                        </a>

                        <form th:action="@{/responsable/empleados/{id}/eliminar(id=${empleado.idStaff})}"
                              method="post"
                              style="display: inline;"
                              onsubmit="return confirm('¿Estás seguro de que querés dar de baja a este empleado?');">

                            <button type="submit" class="btn btn-sm btn-danger">
                                Dar de baja
                            </button>
                        </form>
                    </div>

                    <!-- Acción para empleados inactivos -->
                    <div th:unless="${empleado.activo}">
                        <form th:action="@{/responsable/empleados/{id}/reactivar(id=${empleado.idStaff})}"
                              method="post"
                              style="display: inline;"
                              onsubmit="return confirm('¿Querés reactivar a este empleado?');">

                            <button type="submit" class="btn btn-sm btn-success">
                                Reactivar
                            </button>
                        </form>
                    </div>
                </td>
            </tr>

            <tr th:if="${#lists.isEmpty(empleados)}">
                <td colspan="6" class="text-center">
                    No hay empleados registrados en esta unidad.
                </td>
            </tr>
        </tbody>
    </table>
</div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>

    <div th:replace="~{layout :: scripts}"></div>

</body>
</html>

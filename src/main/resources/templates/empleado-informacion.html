<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body class="admin-body">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="admin-main">
    <div class="admin-container" style="max-width: 1000px;">

        <div class="admin-hero">
            <h1>Mi información</h1>
            <p>Tus datos personales y dónde trabajás</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card admin-card mb-4" th:if="${info != null}">
            <div class="card-body text-left">
                <h5 class="card-title text-center">Datos personales</h5>
                <div class="row">
                    <div class="col-md-6 mb-2"><strong>Nombre:</strong> <span th:text="${info.nombre + ' ' + info.apellido}"></span></div>
                    <div class="col-md-6 mb-2"><strong>DNI:</strong> <span th:text="${info.dni}"></span></div>
                    <div class="col-md-6 mb-2"><strong>Fecha de nacimiento:</strong> <span th:text="${#temporals.format(info.fechaDeNacimiento, 'dd/MM/yyyy')}"></span></div>
                    <div class="col-md-6 mb-2"><strong>Fecha de ingreso:</strong> <span th:text="${#temporals.format(info.fechaDeIngreso, 'dd/MM/yyyy')}"></span></div>
                    <div class="col-md-6 mb-2"><strong>Antigüedad:</strong> <span th:text="${info.antiguedad} + ' año(s)'"></span></div>
                    <div class="col-md-6 mb-2"><strong>Función:</strong>
                        <span th:text="${info.tipoPersonal}"></span>
                        <span th:if="${info.detalleRol != null and !info.detalleRol.isEmpty()}" th:text="'(' + ${info.detalleRol} + ')'"></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="card admin-card" th:if="${info != null}">
            <div class="card-body">
                <h5 class="card-title">Festivales y unidades de venta</h5>

                <div th:if="${#lists.isEmpty(info.participaciones)}">
                    Todavía no tenés una unidad de venta asignada.
                </div>

                <div class="table-responsive" th:unless="${#lists.isEmpty(info.participaciones)}">
                    <table class="table table-dark table-striped">
                        <thead>
                        <tr>
                            <th>Festival</th>
                            <th>Período</th>
                            <th>Estado</th>
                            <th>Unidad de venta</th>
                            <th>Código</th>
                            <th>Tipo</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="p : ${info.participaciones}">
                            <td th:text="${p.nombreFestival}"></td>
                            <td th:text="${#temporals.format(p.fechaInicio, 'dd/MM/yyyy')} + ' al ' + ${#temporals.format(p.fechaFin, 'dd/MM/yyyy')}"></td>
                            <td th:text="${p.estado}"></td>
                            <td th:text="${p.nombreUnidad}"></td>
                            <td th:text="${p.codigoUnico}"></td>
                            <td th:text="${p.tipoUnidad}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/empleado/home}" class="btn btn-pill">Volver al panel</a>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>

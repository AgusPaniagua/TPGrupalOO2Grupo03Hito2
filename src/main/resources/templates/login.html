<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body class="login-body text-white">

    <main class="login-wrapper">
        <div class="login-stage">
            <div class="login-content">

                <div>
                    <img th:src="@{/assets/logo.svg}" alt="Logo" class="login-logo"/>
                    <h1 class="login-title">EPICENTRO GOURMET</h1>
                </div>

                <h2 class="login-subtitle">INGRESAR</h2>

                <div class="alert alert-danger py-2 small" th:if="${param.error}">
                    Usuario o contraseña incorrectos.
                </div>

                <form th:action="@{/loginprocess}" method="post">
                    <div class="form-group">
                        <input type="text" class="form-control form-control-line"
                            id="username" name="username" placeholder="Usuario"
                            required autofocus/>
                    </div>
                    <div class="form-group">
                        <input type="password" class="form-control form-control-line"
                            id="password" name="password" placeholder="Contraseña"
                            required/>
                    </div>
                    <button type="submit" class="btn btn-submit-custom btn-block">ENVIAR</button>
                </form>

            </div>
        </div>
    </main>

    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>


<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <th:block th:replace="~{layout :: head}"></th:block>

    <style>
        .rentabilidad-tabla th,
        .rentabilidad-tabla td {
            color: #ffffff !important;
        }

        .rentabilidad-tabla .text-success {
            color: #198754 !important;
            font-weight: bold;
        }

        .rentabilidad-tabla .text-danger {
            color: #dc3545 !important;
            font-weight: bold;
        }
    </style>
</head>

<body class="admin-body">

<nav th:replace="~{layout :: navbar}"></nav>

<main class="admin-main">
    <div class="admin-container">
        <div class="admin-hero">

            <h1>Rentabilidad Neta entre Fechas</h1>
            <p>
                Festival:
                <strong th:text="${festival.nombre}"></strong>
            </p>
            <div th:if="${error != null}"
                 class="alert alert-danger"
                 th:text="${error}">
            </div>

            <form th:action="@{/responsable/rentabilidad/fechas}"
                  method="post">

                <!-- Seleccionar unidad de venta -->
                <div class="mb-3">
                    <label for="idUnidadDeVenta">Seleccionar unidad de venta:</label>

                    <select id="idUnidadDeVenta"
                            name="idUnidadDeVenta"
                            class="form-control"
                            required>

                        <option value="">Seleccione una unidad</option>

                        <option th:each="unidad : ${unidades}"
                                th:value="${unidad.idUnidadDeVenta}"
                                th:text="${unidad.nombreComercial}"
                                th:selected="${unidadSeleccionada != null and unidad.idUnidadDeVenta == unidadSeleccionada}">
                        </option>

                    </select>
                </div>

                <!-- Fecha desde -->
                <div class="mb-3">
                    <label for="fechaDesde">Fecha desde:</label>
                    <input type="date"
                           id="fechaDesde"
                           name="fechaDesde"
                           class="form-control"
                           th:value="${fechaDesde}"
                           required>
                </div>

                <!-- Fecha hasta -->
                <div class="mb-3">
                    <label for="fechaHasta">Fecha hasta:</label>
                    <input type="date"
                           id="fechaHasta"
                           name="fechaHasta"
                           class="form-control"
                           th:value="${fechaHasta}"
                           required>
                </div>

                <button type="submit" class="btn btn-pill">
                    Calcular rentabilidad
                </button>

            </form>

            <!-- Resultado -->
            <div th:if="${rentabilidad != null}">

                <hr>

                <h3>Resultado de la consulta</h3>

                <p>
                    Unidad de venta:
                    <strong th:text="${unidad.nombreComercial}"></strong>
                </p>

                <p>
                    Período:
                    <strong th:text="${#temporals.format(fechaDesde, 'dd/MM/yyyy')}"></strong>
                    al
                    <strong th:text="${#temporals.format(fechaHasta, 'dd/MM/yyyy')}"></strong>
                </p>

                <h4>Desglose de rentabilidad</h4>

                <table class="table rentabilidad-tabla">
                    <thead>
                    <tr>
                        <th>Concepto</th>
                        <th>Importe</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr>
                        <td>Recaudación</td>
                        <td class="text-success">
                            +$<span th:text="${#numbers.formatDecimal(recaudacion, 1, 2)}"></span>
                        </td>
                    </tr>

                    <tr>
                        <td>Costo de producción</td>
                        <td class="text-danger">
                            -$<span th:text="${#numbers.formatDecimal(costoProduccion, 1, 2)}"></span>
                        </td>
                    </tr>

                    <tr>
                        <td>Sueldos</td>
                        <td class="text-danger">
                            -$<span th:text="${#numbers.formatDecimal(sueldos, 1, 2)}"></span>
                        </td>
                    </tr>

                    <tr>
                        <td>Canon</td>
                        <td class="text-danger">
                            -$<span th:text="${#numbers.formatDecimal(canon, 1, 2)}"></span>
                        </td>
                    </tr>
                    </tbody>
                </table>

                <h3>
                    Rentabilidad neta:
                    <span th:text="${'$' + #numbers.formatDecimal(rentabilidad, 1, 2)}"></span>
                </h3>

            </div>

            <hr>

            <a th:href="@{/responsable/rentabilidad}"
               class="btn btn-pill">
                Volver a rentabilidad general
            </a>

        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

</body>
</html>

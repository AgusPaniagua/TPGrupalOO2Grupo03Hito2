<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body class="admin-body">
    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="admin-main">
        <div class="admin-container admin-form" style="max-width: 720px;">
            <div class="admin-hero text-left">

                <h1 class="text-center mb-4">Registrar Unidad de Venta</h1>

                <div class="alert alert-danger py-2 small" th:if="${error}" th:text="${error}"></div>

                <form th:action="@{/unidades/guardar}" th:object="${registroUnidadDTO}" method="post">

                    <!-- DATOS DE LA UNIDAD -->
                    <h5 class="form-section">1. Información de la unidad</h5>

                    <div class="form-group">
                        <label for="nombreComercial">Nombre comercial</label>
                        <input type="text" class="form-control form-control-line"
                               id="nombreComercial" th:field="*{nombreComercial}" required/>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="superficie">Superficie (m²)</label>
                            <input type="number" step="0.01" class="form-control form-control-line"
                                   id="superficie" th:field="*{superficie}" required/>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="codigoUnico">Código único (10 caracteres)</label>
                            <input type="text" class="form-control form-control-line"
                                   id="codigoUnico" th:field="*{codigoUnico}" maxlength="10" required/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="idFestival">Festival</label>
                        <select class="form-control form-control-line" id="idFestival"
                                th:field="*{idFestival}" required>
                            <option value="">Seleccioná un festival...</option>
                            <option th:each="fest : ${festivales}"
                                    th:value="${fest.idFestival}"
                                    th:text="${fest.nombre}"></option>
                        </select>
                    </div>

                    <!-- DATOS DEL RESPONSABLE -->
                    <h5 class="form-section">2. Responsable y credenciales</h5>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="nombre">Nombre</label>
                            <input type="text" class="form-control form-control-line"
                                   id="nombre" th:field="*{nombre}" required/>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="apellido">Apellido</label>
                            <input type="text" class="form-control form-control-line"
                                   id="apellido" th:field="*{apellido}" required/>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="dni">DNI</label>
                        <input type="number" class="form-control form-control-line"
                               id="dni" th:field="*{dni}" required/>
                    </div>

                    <div class="form-row">
                        <div class="form-group col-md-6">
                            <label for="username">Usuario</label>
                            <input type="text" class="form-control form-control-line"
                                   id="username" th:field="*{username}" required/>
                        </div>
                        <div class="form-group col-md-6">
                            <label for="password">Contraseña</label>
                            <input type="password" class="form-control form-control-line"
                                   id="password" th:field="*{password}" required/>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-pill">Registrar unidad</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>
<body>
    <nav th:replace="~{layout :: navbarPublico}"></nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h3>Registrar Unidad de Venta y Responsable</h3>
                    </div>
                    <div class="card-body">
                        
                        <!-- Mensaje de error o éxito si lo hubiera -->
                        <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

                        <form th:action="@{/unidades/guardar}" th:object="${registroUnidadDTO}" method="post">
                            
                            <!-- SECCIÓN: DATOS DE LA UNIDAD -->
                            <h5 class="text-secondary mb-3">1. Información de la Unidad</h5>
                            
                            <div class="form-group">
                                <label for="nombreComercial">Nombre Comercial</label>
                                <input type="text" class="form-control" id="nombreComercial" th:field="*{nombreComercial}" required/>
                            </div>

                            <div class="form-group">
                                <label for="superficie">Superficie (m²)</label>
                                <input type="number" step="0.01" class="form-control" id="superficie" th:field="*{superficie}" required/>
                            </div>

                            <div class="form-group">
                                <label for="codigoUnico">Código Único (Exactamente 10 caracteres)</label>
                                <input type="text" class="form-control" id="codigoUnico" th:field="*{codigoUnico}" maxlength="10" required/>
                            </div>

                            <div class="form-group">
                                <label for="idFestival">Festival</label>
                                <select class="form-control" id="idFestival" th:field="*{idFestival}" required>
                                    <option value="">Seleccione un festival...</option>
                                    <!-- Iteramos los festivales precargados -->
                                    <option th:each="fest : ${festivales}" th:value="${fest.idFestival}" th:text="${fest.nombre}"></option>
                                </select>
                            </div>

                            <hr class="my-4">

                            <!-- SECCIÓN: DATOS DEL RESPONSABLE Y USUARIO -->
                            <h5 class="text-secondary mb-3">2. Datos del Responsable y Credenciales</h5>

                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="nombre">Nombre</label>
                                    <input type="text" class="form-control" id="nombre" th:field="*{nombre}" required/>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="apellido">Apellido</label>
                                    <input type="text" class="form-control" id="apellido" th:field="*{apellido}" required/>
                                </div>
                            </div>

                            <div class="form-group">
                                <label for="dni">DNI</label>
                                <input type="number" class="form-control" id="dni" th:field="*{dni}" required/>
                            </div>

                            <div class="form-row">
                                <div class="form-group col-md-6">
                                    <label for="username">Usuario (Obligatorio)</label>
                                    <input type="text" class="form-control" id="username" th:field="*{username}" required/>
                                </div>
                                <div class="form-group col-md-6">
                                    <label for="password">Contraseña (Obligatoria)</label>
                                    <input type="password" class="form-control" id="password" th:field="*{password}" required/>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success btn-block mt-4">Registrar Unidad</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>
    <div th:replace="~{layout :: scripts}"></div>
</body>
</html>

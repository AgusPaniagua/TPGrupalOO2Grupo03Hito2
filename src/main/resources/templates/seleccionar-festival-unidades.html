<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>

<body class="admin-body">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="admin-main">
    <div class="admin-container">

        <div class="admin-hero">
            <h1>Unidades de Venta</h1>
            <p>Seleccioná un festival para consultar sus unidades de venta.</p>
        </div>

        <div class="card admin-card admin-list-card">
            <div class="card-body">

                <div th:if="${#lists.isEmpty(festivales)}">
                    No hay festivales registrados.
                </div>

                <div class="table-responsive"
                     th:unless="${#lists.isEmpty(festivales)}">

                    <table class="table table-dark table-striped admin-list-table">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Temporada</th>
                            <th>Fecha de inicio</th>
                            <th>Fecha de fin</th>
                            <th>Acción</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="festival : ${festivales}">
                            <td th:text="${festival.idFestival}"></td>
                            <td th:text="${festival.nombre}"></td>
                            <td th:text="${festival.temporada}"></td>
                            <td th:text="${festival.fechaInicio}"></td>
                            <td th:text="${festival.fechaFin}"></td>

                            <td>
                                <a th:href="@{/festivales/{idFestival}/unidades-de-venta(idFestival=${festival.idFestival})}"
                                   class="btn btn-pill">
                                    Consultar unidades
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>

                </div>

                <a th:href="@{/admin/home}" class="btn btn-pill">
                    Volver al panel
                </a>

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body class="admin-body">

    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="admin-main">
        <div class="admin-container">

            <div class="admin-hero">
                <h1>Registrar nuevo plato</h1>
                <p class="lead mb-0">
                    Completá los datos del plato que ofrecerá tu unidad de venta.
                </p>
            </div>

            <div class="row justify-content-center mt-4">
                <div class="col-md-8 col-lg-6">

                    <div class="card admin-card">
                        <div class="card-body">

                            <div th:if="${mensaje}" class="alert alert-success"
                                th:text="${mensaje}"></div>

                            <div th:if="${error}" class="alert alert-danger"
                                th:text="${error}"></div>

                            <form th:action="@{/responsable/platos/guardar}"
                                  th:object="${platoDTO}"
                                  method="post">

                                <div class="mb-3">
                                    <label for="nombre" class="form-label">
                                        Nombre del plato
                                    </label>

                                    <input type="text" id="nombre"
                                           th:field="*{nombre}"
                                           class="form-control"
                                           placeholder="Ej. Hamburguesa completa">

                                    <div class="text-danger mt-1"
                                         th:if="${#fields.hasErrors('nombre')}"
                                         th:errors="*{nombre}">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="precio" class="form-label">
                                        Precio de venta
                                    </label>

                                    <input type="number" id="precio"
                                           th:field="*{precio}"
                                           class="form-control"
                                           step="0.01" min="0.01"
                                           placeholder="Ej. 5000">

                                    <div class="text-danger mt-1"
                                         th:if="${#fields.hasErrors('precio')}"
                                         th:errors="*{precio}">
                                    </div>
                                </div>

                                <div class="mb-3">
                                    <label for="costoDeProduccion" class="form-label">
                                        Costo de producción
                                    </label>

                                    <input type="number" id="costoDeProduccion"
                                           th:field="*{costoDeProduccion}"
                                           class="form-control"
                                           step="0.01" min="0"
                                           placeholder="Ej. 2500">

                                    <div class="text-danger mt-1"
                                         th:if="${#fields.hasErrors('costoDeProduccion')}"
                                         th:errors="*{costoDeProduccion}">
                                    </div>
                                </div>

                                <div class="d-flex justify-content-between mt-4">
                                    <a th:href="@{/responsable/platos}"
                                       class="btn btn-secondary">
                                        Volver
                                    </a>

                                    <button type="submit" class="btn btn-pill">
                                        Guardar plato
                                    </button>
                                </div>

                            </form>

                        </div>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>

    <div th:replace="~{layout :: scripts}"></div>

</body>
</html>

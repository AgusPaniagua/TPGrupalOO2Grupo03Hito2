<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body class="admin-body">

<nav th:replace="~{layout :: navbar}"></nav>

<main class="admin-main">
  <div class="admin-container">

    <div class="admin-hero">
      <h1>Ranking por Recaudación</h1>
      <p>Seleccioná un festival para consultar el rendimiento de sus unidades de venta.</p>
    </div>

    <div class="card admin-card admin-list-card">
      <div class="card-body p-4">

        <div th:if="${#lists.isEmpty(festivales)}">
          <p>No hay festivales registrados.</p>
        </div>

        <div th:each="festival : ${festivales}"
             class="d-flex justify-content-between align-items-center flex-wrap gap-3 p-3 mb-3 border rounded">

          <div>
            <h5 class="mb-1"
                th:text="${festival.nombre}">
              Nombre del festival
            </h5>

            <small class="text-muted">
              ID:
              <span th:text="${festival.idFestival}"></span>
            </small>
          </div>

          <a th:href="@{/festivales/{idFestival}/ranking-recaudacion(idFestival=${festival.idFestival})}"
             class="btn btn-pill">
            Ver ranking
          </a>

        </div>

        <div class="mt-4">
          <a th:href="@{/admin/home}"
             class="btn btn-pill">
            Volver al panel
          </a>
        </div>

      </div>
    </div>

  </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

</body>
</html>

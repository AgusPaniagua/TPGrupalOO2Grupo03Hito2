<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body class="admin-body">

<nav th:replace="~{layout :: navbar}"></nav>

<main class="admin-main">
  <div class="admin-container">

    <div class="admin-hero">
      <h1>Ranking por Recaudación</h1>
      <p>Seleccioná un festival para consultar el rendimiento de sus unidades de venta.</p>
    </div>

    <div class="card admin-card">
      <div class="card-body p-4">

        <form th:action="@{/ranking-recaudacion/consultar}"
              method="get">

          <div class="mb-4">
            <label for="idFestival" class="form-label">
              <strong>Festival</strong>
            </label>

            <select id="idFestival"
                    name="idFestival"
                    class="form-select"
                    required>

              <option value="" selected disabled>
                Seleccioná un festival...
              </option>

              <option th:each="festival : ${festivales}"
                      th:value="${festival.idFestival}"
                      th:text="${festival.nombre}">
              </option>

            </select>

            <small class="form-text">
              Elegí el festival que querés analizar.
            </small>
          </div>

          <div class="d-flex flex-wrap gap-2">
            <button type="submit" class="btn btn-pill">
              Consultar ranking
            </button>

            <a th:href="@{/admin/home}"
               class="btn btn-pill">
              Volver al panel
            </a>
          </div>

        </form>

      </div>
    </div>

  </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

</body>
</html>

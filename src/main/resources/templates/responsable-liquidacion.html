<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body class="admin-body">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="admin-main">
    <div class="admin-container admin-form" style="max-width: 1200px;">

        <div class="admin-hero">
            <h1>Liquidación de haberes</h1>
            <p th:if="${liquidacion != null}"
               th:text="${liquidacion.nombreUnidad} + ' - ' + ${liquidacion.nombreFestival} + ' (' + ${liquidacion.diasFestival} + ' días)'"></p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="table-responsive" th:if="${liquidacion != null}">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Empleado</th>
                    <th>Función</th>
                    <th>Sueldo base</th>
                    <th>Plus categoría</th>
                    <th>Plus antigüedad</th>
                    <th>Tramos</th>
                    <th>Total a cobrar</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="r : ${liquidacion.recibos}">
                    <td th:text="${r.nombreCompleto}"></td>
                    <td>
                        <span th:text="${r.tipoPersonal}"></span>
                        <span th:if="${r.detalleRol != null and !r.detalleRol.isEmpty()}" th:text="'(' + ${r.detalleRol} + ')'"></span>
                    </td>
                    <td th:text="'$ ' + ${#numbers.formatDecimal(r.sueldoBase, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="'$ ' + ${#numbers.formatDecimal(r.plusCategoria, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="'$ ' + ${#numbers.formatDecimal(r.plusAntiguedad, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="${r.cantidadIntervalos} + ' (' + ${#numbers.formatDecimal(r.porcentajeAplicado, 1, 0)} + '%)'"></td>
                    <td><strong th:text="'$ ' + ${#numbers.formatDecimal(r.totalACobrar, 1, 'POINT', 2, 'COMMA')}"></strong></td>
                </tr>
                <tr th:if="${#lists.isEmpty(liquidacion.recibos)}">
                    <td colspan="7" class="text-center">Tu unidad todavía no tiene personal asignado.</td>
                </tr>
                </tbody>
                <tfoot>
                <tr>
                    <td colspan="6" class="text-right"><strong>TOTAL A PAGAR</strong></td>
                    <td><strong th:text="'$ ' + ${#numbers.formatDecimal(liquidacion.totalAPagar, 1, 'POINT', 2, 'COMMA')}"></strong></td>
                </tr>
                </tfoot>
            </table>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/responsable/home}" class="btn btn-pill">Volver al panel</a>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>

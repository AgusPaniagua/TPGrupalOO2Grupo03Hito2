```html
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body class="admin-body">

    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="admin-main">

        <div class="admin-container admin-form" style="max-width: 1000px;">

            <div class="admin-hero">

                <h1 class="text-center mb-4">Reporte de mayores cánones</h1>

                <p class="text-center">
                    Unidades de venta con los cánones más elevados del festival.
                </p>

                <!-- FORMULARIO DE CONSULTA -->
                <form method="get"
                      th:action="@{/unidades/festivales/{id}/reporte-canon(id=${idFestival})}"
                      class="mb-4">

                    <div class="form-row justify-content-center align-items-end">

                        <div class="form-group col-md-4">
                            <label for="x">Cantidad de unidades</label>
                            <input type="number"
                                   id="x"
                                   name="x"
                                   class="form-control form-control-line"
                                   min="1"
                                   th:value="${cantidad}"
                                   required />
                        </div>

                        <div class="form-group col-md-4">
                            <button type="submit" class="btn btn-pill">
                                Generar reporte
                            </button>
                        </div>

                    </div>
                </form>

                <!-- TABLA DEL REPORTE -->
                <div class="table-responsive">

                    <table class="table table-dark table-hover text-center">

                        <thead>
                            <tr>
                                <th>Posición</th>
                                <th>Nombre comercial</th>
                                <th>Código único</th>
                                <th>Tipo de unidad</th>
                                <th>Canon</th>
                            </tr>
                        </thead>

                        <tbody>

                            <tr th:each="unidad, iter : ${reporte}">
                                <td th:text="${iter.count}"></td>

                                <td th:text="${unidad.nombreComercial}"></td>

                                <td th:text="${unidad.codigoUnico}"></td>

                                <td th:text="${unidad.tipo}"></td>

                                <td th:text="${#numbers.formatDecimal(unidad.canon, 1, 2)}"></td>
                            </tr>

                            <tr th:if="${#lists.isEmpty(reporte)}">
                                <td colspan="5">
                                    No hay unidades de venta para mostrar.
                                </td>
                            </tr>

                        </tbody>

                    </table>

                </div>

                <div class="mt-4">
                    <a th:href="@{/home}" class="btn btn-pill">
                        Volver al inicio
                    </a>
                </div>

            </div>

        </div>

    </main>

    <footer th:replace="~{layout :: footer}"></footer>

    <div th:replace="~{layout :: scripts}"></div>

</body>
</html>
```

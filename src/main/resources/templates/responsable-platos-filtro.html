<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body class="admin-body">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="admin-main">
    <div class="admin-container admin-form" style="max-width: 1000px;">

        <div class="admin-hero">
            <h1>Filtrar platos</h1>
            <p>Platos que ofrece tu unidad de venta</p>
        </div>

        <form method="get" th:action="@{/responsable/platos/filtrar}" th:object="${filtro}" class="mb-4">
            <div class="form-row align-items-end">
                <div class="form-group col-md-4">
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" class="form-control form-control-line" th:field="*{nombre}"/>
                </div>
                <div class="form-group col-md-3">
                    <label for="precioMinimo">Precio mínimo</label>
                    <input type="number" id="precioMinimo" min="0" step="0.01" class="form-control form-control-line" th:field="*{precioMinimo}"/>
                </div>
                <div class="form-group col-md-3">
                    <label for="precioMaximo">Precio máximo</label>
                    <input type="number" id="precioMaximo" min="0" step="0.01" class="form-control form-control-line" th:field="*{precioMaximo}"/>
                </div>
                <div class="form-group col-md-2">
                    <button type="submit" class="btn btn-pill">Buscar</button>
                </div>
            </div>
        </form>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Precio de venta</th>
                    <th>Costo de producción</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="p : ${platos}">
                    <td th:text="${p.nombre}"></td>
                    <td th:text="'$ ' + ${#numbers.formatDecimal(p.precio, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="'$ ' + ${#numbers.formatDecimal(p.costoDeProduccion, 1, 'POINT', 2, 'COMMA')}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(platos)}">
                    <td colspan="3" class="text-center">No hay platos que coincidan con los filtros.</td>
                </tr>
                </tbody>
            </table>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/responsable/home}" class="btn btn-pill">Volver al panel</a>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>

<body class="admin-body">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="admin-main">
    <div class="admin-container">

        <div class="admin-hero">
            <h1>Unidades de venta</h1>
            <p>
                Festival:
                <span th:text="${festival.nombre}"></span>
            </p>
        </div>

        <div class="card admin-card admin-list-card">
            <div class="card-body">

                <!-- Filtro de visualización -->
                <div class="mb-3">
                    <label for="filtroUnidades" class="form-label">
                        Mostrar:
                    </label>

                    <select id="filtroUnidades" class="form-select">
                        <option value="todas">Todas las unidades</option>
                        <option value="ranking">Ranking por recaudación</option>
                    </select>
                </div>
                <!-- Botón para consultar el reporte -->
                <div class="mb-3">
                    <button type="button"
                            id="btnReporte"
                            class="btn btn-pill">
                        <i class="bi bi-cash-stack"></i>
                        Ver reporte de recaudación
                    </button>
                </div>

                <!-- Resultado del reporte -->
                <div id="reporteRecaudacion"
                     class="reporte-card mb-4 d-none">
                    <div class="card-body">
                        <h4>Reporte de Recaudación</h4>

                        <p>
                            Festival:
                            <strong id="nombreFestivalReporte"></strong>
                        </p>

                        <h2 id="totalRecaudacion" class="text-success"></h2>

                        <p class="text-muted mb-0">
                            Recaudación total del festival
                        </p>
                    </div>
                </div>
                <!-- Mensaje cuando no hay unidades -->
                <div id="mensajeVacio"
                     th:classappend="${!#lists.isEmpty(unidadesDeVenta)} ? 'd-none' : ''">
                    Este festival todavía no tiene unidades de venta.
                </div>

                <!-- Tabla -->
                <div class="table-responsive"
                     th:unless="${#lists.isEmpty(unidadesDeVenta)}">

                    <table class="table table-dark table-striped admin-list-table">
                        <thead>
                        <tr id="encabezadoTabla">
                            <th>ID</th>
                            <th>Nombre comercial</th>
                            <th>Superficie (m²)</th>
                            <th>Código único</th>
                        </tr>
                        </thead>

                        <tbody id="tablaUnidades">
                        <tr th:each="unidad : ${unidadesDeVenta}">
                            <td th:text="${unidad.idUnidadDeVenta}"></td>
                            <td th:text="${unidad.nombreComercial}"></td>
                            <td th:text="${unidad.superficie}"></td>
                            <td th:text="${unidad.codigoUnico}"></td>
                        </tr>
                        </tbody>
                    </table>

                </div>

                <a th:href="@{/festivales}" class="btn btn-pill">
                    Volver a festivales
                </a>

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>

<script th:inline="javascript">

    const idFestival = /*[[${festival.idFestival}]]*/ 0;
    const filtro = document.getElementById("filtroUnidades");
    const tabla = document.getElementById("tablaUnidades");
    const encabezado = document.getElementById("encabezadoTabla");
    const mensajeVacio = document.getElementById("mensajeVacio");
    const btnReporte = document.getElementById("btnReporte");
    const reporte = document.getElementById("reporteRecaudacion");

    btnReporte.addEventListener("click", async function () {

        // Si el reporte ya está visible, lo ocultamos
        if (!reporte.classList.contains("d-none")) {
            reporte.classList.add("d-none");
            return;
        }

        try {
            const respuesta = await fetch(
                `/api/festivales/${idFestival}/reporte-recaudacion`
            );

            if (!respuesta.ok) {
                throw new Error("No se pudo obtener el reporte");
            }

            const datos = await respuesta.json();

            document.getElementById("nombreFestivalReporte")
                .textContent = datos.nombreFestival;

            document.getElementById("totalRecaudacion")
                .textContent = datos.recaudacionTotal.toLocaleString(
                "es-AR",
                {
                    style: "currency",
                    currency: "ARS"
                }
            );

            reporte.classList.remove("d-none");

        } catch (error) {
            console.error(error);
            alert("No se pudo cargar el reporte de recaudación.");
        }
    });
    filtro.addEventListener("change", async function () {

        const modo = filtro.value;

        if (modo === "todas") {
            window.location.reload();
            return;
        }

        try {
            const respuesta = await fetch(
                `/festivales/${idFestival}/ranking-recaudacion`
            );

            if (!respuesta.ok) {
                throw new Error("No se pudo obtener el ranking");
            }

            const ranking = await respuesta.json();

            encabezado.innerHTML = `
                <th>Posición</th>
                <th>Nombre comercial</th>
                <th>Tipo</th>
                <th>Recaudación</th>
            `;

            tabla.innerHTML = "";

            if (ranking.length === 0) {
                mensajeVacio.textContent =
                    "No hay unidades de venta para mostrar.";
                mensajeVacio.style.display = "block";
            } else {
                mensajeVacio.style.display = "none";

                ranking.forEach((unidad, index) => {
                    const fila = document.createElement("tr");

                    const posicion = document.createElement("td");
                    posicion.textContent = index + 1;

                    const nombre = document.createElement("td");
                    nombre.textContent = unidad.nombreComercial;

                    const tipo = document.createElement("td");
                    tipo.textContent = unidad.tipoUnidad;

                    const recaudacion = document.createElement("td");
                    recaudacion.textContent =
                        "$ " + unidad.recaudacion.toLocaleString("es-AR");

                    fila.append(posicion, nombre, tipo, recaudacion);
                    tabla.appendChild(fila);
                });
            }

        } catch (error) {
            console.error(error);
            alert("Ocurrió un error al cargar el ranking.");
            filtro.value = "todas";
        }
    });

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head}"></head>

<body class="admin-body">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="admin-main">
    <div class="admin-container">

        <div class="admin-hero">
            <h1>Unidades de venta</h1>
            <p>
                Festival:
                <span th:text="${festival.nombre}"></span>
            </p>
        </div>

        <div class="card admin-card">
            <div class="card-body">

                <div th:if="${#lists.isEmpty(unidadesDeVenta)}">
                    Este festival todavía no tiene unidades de venta.
                </div>

                <div class="table-responsive"
                     th:unless="${#lists.isEmpty(unidadesDeVenta)}">

                    <table class="table table-dark table-striped">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre comercial</th>
                            <th>Superficie (m²)</th>
                            <th>Código único</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="unidad : ${unidadesDeVenta}">
                            <td th:text="${unidad.idUnidadDeVenta}"></td>
                            <td th:text="${unidad.nombreComercial}"></td>
                            <td th:text="${unidad.superficie}"></td>
                            <td th:text="${unidad.codigoUnico}"></td>
                        </tr>
                        </tbody>
                    </table>

                </div>

                <a th:href="@{/festivales}" class="btn btn-pill">
                    Volver a festivales
                </a>

            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>

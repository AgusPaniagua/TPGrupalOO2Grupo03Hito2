```html
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head}"></head>

<body class="admin-body">

    <nav th:replace="~{layout :: navbar}"></nav>

    <main class="admin-main">
        <div class="admin-container">

            <div class="d-flex justify-content-between align-items-center mt-4 mb-3">
                <h2>Gestión de platos</h2>

                <a th:href="@{/responsable/platos/nuevo}" class="btn btn-pill">
                    Nuevo plato
                </a>
            </div>

            <!-- Mensajes -->
            <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <div class="table-responsive mt-4">
                <table class="table table-hover text-white">

                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Precio de venta</th>
                            <th>Costo de producción</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr th:each="plato : ${platos}">
                            <td th:text="${plato.nombre}"></td>
                            <td th:text="${plato.precio}"></td>
                            <td th:text="${plato.costoDeProduccion}"></td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(platos)}">
                            <td colspan="3" class="text-center">
                                No hay platos registrados en esta unidad.
                            </td>
                        </tr>
                    </tbody>

                </table>
            </div>

        </div>
    </main>

    <footer th:replace="~{layout :: footer}"></footer>

    <div th:replace="~{layout :: scripts}"></div>

</body>
</html>

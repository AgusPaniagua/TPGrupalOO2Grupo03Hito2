<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: head}"></head>
<body class="admin-body">
<nav th:replace="~{layout :: navbar}"></nav>

<main class="admin-main">
    <div class="admin-container" style="max-width: 1100px;">

        <div class="admin-hero">
            <h1>Mis sueldos</h1>
            <p>Sueldo que te corresponde en cada festival</p>
        </div>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card admin-card">
            <div class="card-body">

                <div th:if="${recibos != null and #lists.isEmpty(recibos)}">
                    Todavía no tenés sueldos para mostrar: no estás asignado a ningún festival.
                </div>

                <div class="table-responsive" th:if="${recibos != null and !#lists.isEmpty(recibos)}">
                    <table class="table table-dark table-striped">
                        <thead>
                        <tr>
                            <th>Festival</th>
                            <th>Estado</th>
                            <th>Días</th>
                            <th>Sueldo base</th>
                            <th>Plus</th>
                            <th>% aplicado</th>
                            <th>Total a cobrar</th>
                            <th>Recibo</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="r : ${recibos}">
                            <td th:text="${r.nombreFestival}"></td>
                            <td th:text="${r.estadoFestival}"></td>
                            <td th:text="${r.diasFestival}"></td>
                            <td th:text="'$ ' + ${#numbers.formatDecimal(r.sueldoBase, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td th:text="'$ ' + ${#numbers.formatDecimal(r.plusCategoria + r.plusAntiguedad, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td th:text="${#numbers.formatDecimal(r.porcentajeAplicado, 1, 0)} + '%'"></td>
                            <td><strong th:text="'$ ' + ${#numbers.formatDecimal(r.totalACobrar, 1, 'POINT', 2, 'COMMA')}"></strong></td>
                            <td>
                                <a th:href="@{/empleado/sueldos/{id}/recibo(id=${r.idFestival})}" class="btn btn-pill btn-sm">
                                    Descargar PDF
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="text-center mt-4">
            <a th:href="@{/empleado/home}" class="btn btn-pill">Volver al panel</a>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>
<div th:replace="~{layout :: scripts}"></div>
</body>
</html>
